<section class="formulario">
  <h2>Cadastrar emprestimo</h2>

  <form (ngSubmit)="cadastrar()">
    <label for="nomePessoa">Nome da pessoa</label>
    <input
      id="nomePessoa"
      type="text"
      name="nomePessoa"
      [(ngModel)]="nomePessoa"
      required
    />

    <label for="tituloLivro">Titulo do livro</label>
    <input
      id="tituloLivro"
      type="text"
      name="tituloLivro"
      [(ngModel)]="tituloLivro"
      required
    />

    <label for="dataPrevistaDevolucao">
      Data prevista de devolução
    </label>
    <input
      id="dataPrevistaDevolucao"
      type="date"
      name="dataPrevistaDevolucao"
      [(ngModel)]="dataPrevistaDevolucao"
      required
    />

    <button type="submit">Cadastrar emprestimo</button>
  </form>
</section>
